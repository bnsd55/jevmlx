name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14  # Apple Silicon runner (MLX requires arm64 macOS)
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Install Python toolchain and project
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e '.[dev,bench]'

      - name: Lint (ruff)
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Fast tests (no model downloads, no Hub access)
        run: .venv/bin/pytest -m "not slow and not network" -q

      - name: Cache pinned golden-prompt tokenizers (W5c-5)
        # F1: the tokenizers are PINNED to snapshot revisions (the key), so
        # the cache is stable and only downloads tokenizer files (KBs-MBs,
        # never model weights).
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: golden-prompts-qwen25-a5339a41-gemma-2c715097

      - name: Golden prompt vectors (W5c-5)
        # ONE step for the whole prompt contract (F3): --check re-renders
        # every committed vector through the live renderer and diffs the
        # doc's generated sections. A cold-offline cache miss exits with a
        # clear 'tokenizer not available' message, not a traceback. The
        # pytest fast suite stays HF-free: its real-tokenizer tests carry
        # the network marker and are excluded with -m 'not network'.
        run: .venv/bin/python -m benchmarks.golden_prompts --check

  js-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build
        run: npm run typecheck && npm run build

      - name: Tests (no network)
        run: npm test
