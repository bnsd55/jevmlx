name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14  # Apple Silicon runner (MLX requires arm64 macOS)
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Install Python toolchain and project
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e '.[dev]'

      - name: Lint (ruff)
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Fast tests (no model downloads)
        run: .venv/bin/pytest -m "not slow" -q
