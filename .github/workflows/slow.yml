name: Slow tests (0.5B)

# Manual only: the shared macOS runner GPU is not stable enough for model
# tests (Metal command-buffer timeouts, NaN logits observed). Real-hardware
# slow tests run in the m5 runbook step before every bench.
# Runs the -m slow suite against the pinned 0.5B dev model. NOT a required
# check — main protection stays test (CI) + build.
on:
  workflow_dispatch:

jobs:
  slow:
    runs-on: macos-14  # Apple Silicon runner (MLX requires arm64 macOS)
    timeout-minutes: 40
    env:
      MODEL_ID: mlx-community/Qwen2.5-0.5B-Instruct-4bit
      JEVMLX_CI_SLOW: "1"
      HF_HUB_OFFLINE: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Install Python toolchain and project
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e '.[dev,bench]'

      - name: Cache pinned 0.5B model weights
        # Pre-download the 0.5B so repeated runs do not re-download. The key
        # is the model id; a bump invalidates the cache and re-downloads.
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: slow-model-qwen25-0.5b-instruct-4bit

      - name: Pre-download 0.5B model
        # Force the download into the cache before pytest runs so the first
        # test does not pay the download cost and HF_HUB_OFFLINE stays 0.
        run: |
          .venv/bin/python - <<'PY'
          from huggingface_hub import snapshot_download
          path = snapshot_download("mlx-community/Qwen2.5-0.5B-Instruct-4bit")
          print(f"cached at {path}")
          PY

      - name: Slow tests (0.5B)
        run: .venv/bin/python -m pytest -m slow -q -p no:cacheprovider
